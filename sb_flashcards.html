:root { --bg:#0b1020; --card:#121a33; --card2:#0f1730; --text:#e8ecff; --muted:#b8c0ff; --accent:#7aa6ff; }

.wrap{max-width:1180px;margin:0 auto;}
h1{margin:0;font-size:18px;}
.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.35;}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;}

button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer;}
button:hover{background:rgba(255,255,255,.10);}
main{padding:14px;}
.grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
.card{perspective:1200px;height:250px;cursor:pointer;user-select:none;outline:none;}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 260ms ease;border-radius:14px;}
.card[aria-pressed="true"] .inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:14px;padding:14px 14px 12px;box-shadow:0 12px 28px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.10);backface-visibility:hidden;display:flex;flex-direction:column;gap:10px;}
.front{background:radial-gradient(1200px 280px at 30% -40%, rgba(122,166,255,.35), transparent 55%), var(--card);}
.back{background:radial-gradient(900px 260px at 80% -35%, rgba(122,166,255,.25), transparent 60%), var(--card2);transform:rotateY(180deg);}
.tagrow{display:flex;gap:8px;align-items:center;justify-content:space-between;}
.tag{font-size:12px;color:var(--muted);}
.hint{font-size:12px;color:var(--muted);}
.title{font-weight:700;font-size:14px;color:var(--accent);}
.bullets{margin:0;padding-left:18px;line-height:1.35;font-size:14px;}
.answer{font-size:20px;font-weight:900;letter-spacing:.2px;}
.mini{font-size:12.5px;color:var(--muted);line-height:1.35;}
.counter{margin-left:auto;color:var(--muted);font-size:12.5px;}
small.kbd{padding:2px 8px;border:1px solid rgba(255,255,255,.14);border-radius:999px;color:var(--muted);}
</style>

 "frontBullets": ["Mary Anning collected these objects in Lyme Regis.", "Types of these objects include coprolites, and an arrangement of these objects comprise \"Sue\" at Chicago’s Field Museum.", "Iguanodon and Diplodocus were identified after discovering, for the point, what objects dug up by paleontologists?"], "backAnswer": "Fossils", "backNotes": ["Source: 7-22-ES-Regionals-Science-Bee-Round-1 (Q24)"]}, {"id": "7-22-ES-Regionals-Science-Bee-Round-1-q25", "source": "7-22-ES-Regionals-Science-Bee-Round-1.pdf", "qnum": 25, "frontBullets": ["An unnamed ring of this planet parallels the orbit of its moon Galatea.", "Objects in a 1:2 resonance with this planet are known as “twotinos,” and a spinning storm on this planet is known as the Great Dark Spot.", "Triton is a moon of, for the point, what planet in the solar system, located farthest from the Sun?"], "backAnswer": "Neptune 2021-22 ES Science Bee 1 V", "backNotes": ["Source: 7-22-ES-Regionals-Science-Bee-Round-1 (Q25)"]}, {"id": "7-22-ES-Regionals-Science-Bee-Round-1-q1", "source": "7-22-ES-Regionals-Science-Bee-Round-1.pdf", "qnum": 1, "frontBullets": ["The earliest estimate of this quantity depended on indirect estimates of the number of particles of latex.", "Jean Perrin defined this constant, denoted capital N, as the number of atoms in 16 grams of oxygen."], "backAnswer": "Avogadro's Constant", "backNotes": ["Source: 7-22-ES-Regionals-Science-Bee-Round-1 (Q1)"]}, {"id": "7-22-ES-Regionals-Science-Bee-Round-1-q2", "source": "7-22-ES-Regionals-Science-Bee-Round-1.pdf", "qnum": 2, "frontBullets": ["The product of the linear dimension and flow speed is divided by this quantity to give the Reynolds number.", "This quantity's kinematic form is equal to its dynamic form divided by the density of the fluid."], "backAnswer": "Viscosity", "backNotes": ["Source: 7-22-ES-Regionals-Science-Bee-Round-1 (Q2)"]}]</script>
<script>
const allCards = JSON.parse(document.getElementById('data').textContent);

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sourceFilter = document.getElementById('sourceFilter');
const counter = document.getElementById('counter');
const showMoreBtn = document.getElementById('showMoreBtn');

let viewLimit = 60; // render first N for performance; click "Show more" to expand
let current = [...allCards];

function uniqSources(cards){
  const s = new Set(cards.map(c=>c.source));
  return ['All sources', ...Array.from(s).sort()];
}

function fillSources(){
  const options = uniqSources(allCards);
  sourceFilter.innerHTML = options.map(v=>`<option value="${v}">${v}</option>`).join('');
}
fillSources();

function makeCard(c){
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role','button');
  card.setAttribute('aria-pressed','false');
  card.setAttribute('aria-label', `Flashcard: ${c.backAnswer}. Click to flip.`);
  const srcTag = (c.source ? c.source.replace('.pdf','') : 'Source');
  card.innerHTML = `
    <div class="inner">
      <section class="face front">
        <div class="tagrow">
          <div class="tag">${srcTag} • Q${c.qnum}</div>
          <div class="hint">Tap to flip →</div>
        </div>
        <div class="title">What is it?</div>
        <ul class="bullets">${c.frontBullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      </section>
      <section class="face back">
        <div class="tagrow">
          <div class="tag">Answer</div>
          <div class="hint">← Tap back</div>
        </div>
        <div class="answer">✅ ${c.backAnswer}</div>
        <div class="mini">${(c.backNotes||[]).map(n=>`• ${n}`).join('<br>')}</div>
      </section>
    </div>`;
  function toggle(){
    const pressed = card.getAttribute('aria-pressed') === 'true';
    card.setAttribute('aria-pressed', String(!pressed));
  }
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }
  });
  return card;
}

function render(){
  grid.innerHTML = '';
  const shown = current.slice(0, viewLimit);
  shown.forEach(c => grid.appendChild(makeCard(c)));
  const total = current.length;
  counter.textContent = `Showing ${Math.min(viewLimit,total)} of ${total} cards`;
  showMoreBtn.style.display = (viewLimit < total) ? 'inline-block' : 'none';
}

function applyFilters(){
  const q = (search.value||'').trim().toLowerCase();
  const src = sourceFilter.value;
  current = allCards.filter(c => {
    const srcOk = (src === 'All sources') || (c.source === src);
    if(!srcOk) return false;
    if(!q) return true;
    const hay = (c.backAnswer + ' ' + (c.frontBullets||[]).join(' ') + ' ' + (c.backNotes||[]).join(' ')).toLowerCase();
    return hay.includes(q);
  });
  viewLimit = 60;
  render();
}

search.addEventListener('input', applyFilters);
sourceFilter.addEventListener('change', applyFilters);

document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.card').forEach(card => card.setAttribute('aria-pressed','false'));
});

document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  // Fisher–Yates
  for(let i=current.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [current[i],current[j]]=[current[j],current[i]];
  }
  viewLimit = 60;
  render();
});

showMoreBtn.addEventListener('click', ()=>{
  viewLimit += 60;
  render();
});

applyFilters();
</script>
</body>
