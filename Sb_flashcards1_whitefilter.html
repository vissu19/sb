<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Science Bee Flashcards (Full Set)</title>
<style>
  :root {
    --bg:#0b1020; --panel:#121a33; --panel2:#0f1630; --text:#e9ecff; --muted:#a9b0d6;
    --accent:#7aa2ff; --good:#7cffb2; --warn:#ffd37a; --bad:#ff7aa2; --border:#22305a;
  }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:linear-gradient(180deg, var(--bg), #070b16); color:var(--text); }
  header { padding:16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(11,16,32,0.92); backdrop-filter: blur(8px); z-index:10; }
  h1 { margin:0; font-size:18px; letter-spacing:.2px; }
  .sub { margin-top:6px; color:var(--muted); font-size:12px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; align-items:center; }
  .control { display:flex; flex-direction:column; gap:6px; }
  label { font-size:11px; color:var(--muted); }
  
  input[type="checkbox"] { width:18px; height:18px; accent-color: var(--accent); }
select, input[type="text"] {
    background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:13px; outline:none;
  }
  select:focus, input[type="text"]:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(122,162,255,.15); }
  .btn {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; font-size:13px; cursor:pointer;
  }
  .btn:hover { border-color:var(--accent); }
  main { padding:18px; max-width:1100px; margin:0 auto; }
  .meta { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-bottom:12px; }
  .pill { padding:4px 10px; border:1px solid var(--border); border-radius:999px; background:rgba(18,26,51,.6); }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .card {
    background:linear-gradient(180deg, rgba(18,26,51,.95), rgba(15,22,48,.95));
    border:1px solid var(--border); border-radius:16px; overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .cardhead { padding:14px 14px 10px 14px; border-bottom:1px solid rgba(34,48,90,.7); }
  .titleRow { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .title { font-weight:750; font-size:15px; line-height:1.2; }
  .seq { color:var(--good); font-weight:800; font-size:12px; letter-spacing:.5px; }
  .tags { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .tag { font-size:11px; color:var(--muted); border:1px solid rgba(34,48,90,.8); border-radius:999px; padding:3px 8px; }
  .body { padding:12px 14px 14px 14px; }
  .sectionTitle { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin:10px 0 6px; }
  ul { margin:0; padding-left:18px; }
  li { margin:6px 0; color:var(--text); }
  .quick {
    background:rgba(122,162,255,.12); border:1px solid rgba(122,162,255,.28);
    padding:10px 12px; border-radius:12px; color:var(--text);
  }
  .answerWrap { margin-top:10px; }
  .flip {
    width:100%; text-align:left; padding:10px 12px; border-radius:12px;
    border:1px dashed rgba(169,176,214,.35); background:rgba(255,255,255,.03);
    cursor:pointer; color:var(--text);
  }
  .flip strong { color:var(--accent); }
  .answer {
    display:none; margin-top:10px; padding:10px 12px; border-radius:12px;
    background:rgba(124,255,178,.10); border:1px solid rgba(124,255,178,.25);
  }
  .sources { font-size:11px; color:var(--muted); margin-top:10px; }
  .footerNote { color:var(--muted); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>Science Bee Flashcards (Full Set)</h1>
  <div class="sub">Sequence numbers + 25-card range review + filters. Click “Show answer” to flip.</div>

  <div class="controls">
    <div class="control">
      <label for="rangeSel">Review range (25 at a time)</label>
      <select id="rangeSel"></select>
    </div>

    <div class="control">
      <label for="catSel">Category</label>
      <select id="catSel"></select>
    </div>

    <div class="control">
      <label for="srcSel">Source</label>
      <select id="srcSel"></select>
    </div>

    <div class="control" style="min-width:240px; flex: 1 1 260px;">
      <label for="searchBox">Search (topic / clue / answer)</label>
      <input id="searchBox" type="text" placeholder="Try: mitochondria, Mars, recursion, insulin…" />
    </div>

    <button class="btn" id="resetBtn" title="Reset filters">Reset</button>
  </div>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div class="footerNote">Tip: Use the 25-card range dropdown for bite-sized sessions, and track breaks by the last sequence number you completed.</div>
</main>

function uniq(arr) {
  return Array.from(new Set(arr));
}

function buildRangeOptions(maxSeq) {
  const opts = [{value:"ALL", label:`All (1–${maxSeq})`}];
  for (let start=1; start<=maxSeq; start+=25) {
    const end = Math.min(maxSeq, start+24);
    opts.push({value:`${start}-${end}`, label:`${start}–${end}`});
  }
  return opts;
}

function initFilters() {
  const maxSeq = Math.max(...CARDS.map(c=>c.seq));
  const rangeSel = document.getElementById("rangeSel");
  const catSel = document.getElementById("catSel");
  const srcSel = document.getElementById("srcSel");

  // Range dropdown
  buildRangeOptions(maxSeq).forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o.value; opt.textContent=o.label;
    rangeSel.appendChild(opt);
  });
  rangeSel.value = "ALL";

  // Category dropdown
  const cats = ["All"].concat(uniq(CARDS.map(c=>c.category)).sort());
  cats.forEach(c=>{
    const opt=document.createElement("option");
    opt.value=c; opt.textContent=c;
    catSel.appendChild(opt);
  });
  catSel.value="All";

  // Source dropdown (by file name only)
  const srcs = ["All"].concat(uniq(CARDS.flatMap(c=>c.sources.map(s=>s.split(" Q")[0]))).sort());
  srcs.forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s; opt.textContent=s;
    srcSel.appendChild(opt);
  });
  srcSel.value="All";
}

function passesFilters(card) {
  const [rangeVal, catVal, srcVal, searchVal] = [
    document.getElementById("rangeSel").value,
    document.getElementById("catSel").value,
    document.getElementById("srcSel").value,
    document.getElementById("searchBox").value.trim().toLowerCase(),
  ];
  const whiteOnly = document.getElementById("whiteOnly").checked;

  // range
  if (rangeVal !== "ALL") {
    const [a,b] = rangeVal.split("-").map(x=>parseInt(x,10));
    if (!(card.seq >= a && card.seq <= b)) return false;
  }

  // category
  if (catVal !== "All" && card.category !== catVal) return false;

  // source
  if (srcVal !== "All") {
    const files = card.sources.map(s=>s.split(" Q")[0]);
    if (!files.includes(srcVal)) return false;
  }

  // white set
  if (whiteOnly && !card.is_white_topic) return false;

  // search
  if (searchVal) {
    const hay = [
      card.title,
      card.answer,
      card.category,
      card.quick || "",
      ...(card.clues||[]),
      ...(card.extras||[]),
      ...(card.sources||[]),
    ].join(" ").toLowerCase();
    if (!hay.includes(searchVal)) return false;
  }

  return true;
}

function render() {
  const grid = document.getElementById("grid");
  const meta = document.getElementById("meta");
  grid.innerHTML = "";

  const filtered = CARDS.filter(passesFilters);

  const rangeVal = document.getElementById("rangeSel").value;
  const maxSeq = Math.max(...CARDS.map(c=>c.seq));
  let rangeLabel = (rangeVal==="ALL") ? `#1–#${maxSeq}` : `#${rangeVal.replace("-", "–#")}`;

  meta.innerHTML = `
    <span class="pill">Total topics: <strong>${CARDS.length}</strong></span>
    <span class="pill">Showing: <strong>${filtered.length}</strong></span>
    <span class="pill">Range: <strong>${rangeLabel}</strong></span>
  `;

  for (const c of filtered) {
    const el = document.createElement("div");
    el.className = "card";
    const sources = (c.sources||[]).slice(0,5).join(" • ");
    const clueLis = (c.clues||[]).slice(0,6).map(x=>`<li>${escapeHtml(x)}</li>`).join("");
    const extraLis = (c.extras||[]).slice(0,3).map(x=>`<li>${escapeHtml(x)}</li>`).join("");
    const quick = c.quick ? `<div class="quick"><strong>Quick ID:</strong> ${escapeHtml(c.quick)}</div>` : "";

    el.innerHTML = `
      <div class="cardhead">
        <div class="titleRow">
          <div class="title">${escapeHtml(c.title)}</div>
          <div class="seq">#${String(c.seq).padStart(3,"0")}</div>
        </div>
        <div class="tags">
          <span class="tag">${escapeHtml(c.category)}</span>
        </div>
      </div>
      <div class="body">
        ${quick}

        <div class="sectionTitle">Science Bee clues (pulled from question sets)</div>
        <ul>${clueLis || "<li>(No clue text extracted)</li>"}</ul>

        ${extraLis ? `
          <div class="sectionTitle">Extra “buzz fast” aids</div>
          <ul>${extraLis}</ul>
        ` : ""}

        <div class="answerWrap">
          <button class="flip" type="button">Show answer</button>
          <div class="answer"><strong>Answer:</strong> ${escapeHtml(c.answer)}</div>
        </div>

        <div class="sources">Sources: ${escapeHtml(sources || "—")}</div>
      </div>
    `;
    // flip handler
    const btn = el.querySelector(".flip");
    const ans = el.querySelector(".answer");
    btn.addEventListener("click", () => {
      const open = ans.style.display === "block";
      ans.style.display = open ? "none" : "block";
      btn.textContent = open ? "Show answer" : "Hide answer";
    });
    grid.appendChild(el);
  }
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function wireEvents() {
  ["rangeSel","catSel","srcSel","whiteOnly"].forEach(id=>{
    document.getElementById(id).addEventListener("change", render);
  });
  document.getElementById("searchBox").addEventListener("input", () => {
    // tiny debounce
    window.clearTimeout(window.__sb_t);
    window.__sb_t = window.setTimeout(render, 80);
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    document.getElementById("rangeSel").value="ALL";
    document.getElementById("catSel").value="All";
    document.getElementById("srcSel").value="All";
    document.getElementById("searchBox").value="";
    document.getElementById("whiteOnly").checked=false;
    render();
  });
}

initFilters();
wireEvents();
render();
